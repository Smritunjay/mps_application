<div class="input-field" [ngClass]="field?.componentClasses">
    @if (field.label) {
        <label class="input-field__label">{{ field.label }}</label>
    }
    <input type="text" [placeholder]="field.placeholder ?? ''" 
    [formControl]="control" [required]="field.required" class="input-field__input">
    @if (errorMessage) {
        <div class="input-field__error">{{ errorMessage }}</div>
    }
</div>
